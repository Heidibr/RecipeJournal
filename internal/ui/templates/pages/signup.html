{{define "title"}}Sign up · Recipe Journal{{end}}
{{define "content"}}
<div class="max-w-md mx-auto bg-paper border-l-4 border-ribbon px-8 py-10 mt-8">
  <h1 class="font-display text-4xl mb-2">start your journal</h1>
  <p class="italic text-muted mb-6">a place for the recipes worth keeping</p>
  {{if .Error}}<div class="mb-4 text-sm text-ribbon">{{.Error}}</div>{{end}}
  <form method="post" action="/signup" class="space-y-5">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <label class="block">
      <span class="italic text-sm text-muted">name</span>
      <input name="name" required autofocus
        class="block w-full mt-1 border-b border-muted/40 bg-transparent py-2 focus:border-ink outline-none"
        value="{{.Name}}">
    </label>
    <label class="block">
      <span class="italic text-sm text-muted">email</span>
      <input name="email" type="email" required
        class="block w-full mt-1 border-b border-muted/40 bg-transparent py-2 focus:border-ink outline-none"
        value="{{.Email}}">
    </label>
    <label class="block">
      <span class="italic text-sm text-muted">password (min 8 characters)</span>
      <input name="password" type="password" required minlength="8"
        class="block w-full mt-1 border-b border-muted/40 bg-transparent py-2 focus:border-ink outline-none">
    </label>
    <button type="submit" class="w-full bg-ink text-cream py-3 uppercase tracking-widest text-sm hover:bg-ribbon transition-colors">Create journal</button>
  </form>
  <p class="mt-6 text-sm text-muted italic text-center">
    already have an account? <a href="/login" class="text-ribbon underline-offset-4 hover:underline">log in</a>
  </p>
</div>
{{end}}

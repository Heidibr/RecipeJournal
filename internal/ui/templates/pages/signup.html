{{define "title"}}{{T "title.signup"}} · {{T "app.name"}}{{end}}
{{define "content"}}
<div class="max-w-md mx-auto bg-paper border border-sand rounded-xl px-8 py-10 mt-8">
  <img src="/static/img/logo-stablet.svg" alt="" class="logo h-24 mx-auto mb-8"
       width="216" height="96">
  <h1 class="font-display text-4xl mb-2">{{T "signup.heading"}}</h1>
  <p class="italic text-muted mb-6">{{T "signup.sub"}}</p>
  {{if .Error}}<div class="mb-4 text-sm text-brick">{{.Error}}</div>{{end}}
  <form method="post" action="/signup" class="space-y-5">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <label class="block">
      <span class="italic text-sm text-muted">{{T "field.name"}}</span>
      <input name="name" required autofocus
        class="field mt-1"
        value="{{.Name}}">
    </label>
    <label class="block">
      <span class="italic text-sm text-muted">{{T "field.email"}}</span>
      <input name="email" type="email" required
        class="field mt-1"
        value="{{.Email}}">
    </label>
    <label class="block">
      <span class="italic text-sm text-muted">{{T "field.password_min"}}</span>
      <input name="password" type="password" required minlength="8"
        class="field mt-1">
    </label>
    <button type="submit" class="btn btn-primary btn-block">{{T "signup.submit"}}</button>
  </form>
  <p class="mt-6 text-sm text-muted italic text-center">
    {{T "signup.have_account"}} <a href="/login" class="text-ribbon underline-offset-4 hover:underline">{{T "signup.login_link"}}</a>
  </p>
</div>
{{end}}

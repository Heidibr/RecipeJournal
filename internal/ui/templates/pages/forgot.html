{{define "title"}}{{T "title.forgot"}} · {{T "app.name"}}{{end}}
{{define "content"}}
<div class="max-w-md mx-auto bg-paper border border-sand rounded-xl px-8 py-10 mt-8">
  <h1 class="font-display text-4xl mb-2">{{T "forgot.heading"}}</h1>
  <p class="italic text-muted mb-6">{{T "forgot.sub"}}</p>
  <form method="post" action="/forgot" class="space-y-5">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <label class="block">
      <span class="italic text-sm text-muted">{{T "field.email"}}</span>
      <input name="email" type="email" required autofocus
        class="field mt-1">
    </label>
    <button type="submit" class="btn btn-primary btn-block">{{T "forgot.submit"}}</button>
  </form>
  <p class="mt-6 text-sm text-muted italic text-center">
    {{T "forgot.remembered"}} <a href="/login" class="text-ribbon underline-offset-4 hover:underline">{{T "forgot.login_link"}}</a>
  </p>
</div>
{{end}}

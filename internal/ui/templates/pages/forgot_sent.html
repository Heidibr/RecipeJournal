{{define "title"}}{{T "title.reset_sent"}} · {{T "app.name"}}{{end}}
{{define "content"}}
<div class="max-w-md mx-auto bg-paper border-l-4 border-ribbon px-8 py-10 mt-8">
  <h1 class="font-display text-3xl mb-3">{{T "sent.heading"}}</h1>
  <p class="italic text-muted mb-2">{{T "sent.reset_body"}}</p>
  <p class="italic text-muted mb-6">{{T "sent.reset_expiry"}}</p>
  <a href="/login" class="block w-full text-center bg-ink text-cream py-3 uppercase tracking-widest text-sm hover:bg-ribbon transition-colors">{{T "sent.back_to_login"}}</a>
</div>
{{end}}

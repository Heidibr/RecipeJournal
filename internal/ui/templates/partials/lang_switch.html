{{define "lang_switch.html"}}<form action="/lang/{{otherLang}}" method="post" class="inline">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <button type="submit" lang="{{otherLang}}"
          title="{{Tf "nav.lang_switch_to" otherLangLabel}}"
          class="text-xs sm:btn btn-quiet btn-sm">{{otherLang}}</button>
</form>{{end}}
